<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>登录 Niko</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles-wordmark.css" />
    <link rel="stylesheet" href="/account.css" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      async
      defer
    ></script>
    <script type="module" src="/js/auth.js"></script>
  </head>
  <body class="account-body" data-auth-page="login">
    <a class="skip-link" href="#main">跳到登录表单</a>
    <header class="account-header">
      <a class="brand" href="/" aria-label="Niko 首页">
        <img src="/assets/niko-lockup-horizontal.svg" alt="Niko" width="168" height="60" />
      </a>
      <a class="text-link" href="/">返回首页</a>
    </header>

    <main class="auth-layout" id="main">
      <section class="auth-intro" aria-labelledby="auth-intro-title">
        <img class="auth-intro-mark" src="/assets/niko-mark.svg" alt="" width="64" height="64" />
        <p class="account-eyebrow">Niko 账号</p>
        <h1 id="auth-intro-title">一个账号，连接桌面端与官网。</h1>
        <p>
          在这里登录后，可以查看同一账号的余额、充值记录和使用明细。数据来自统一账户服务，不会在 Niko 另建一份余额。
        </p>
        <ul class="trust-points">
          <li><span>✓</span><p>账号、余额与桌面端保持一致</p></li>
          <li><span>✓</span><p>登录凭证仅保存在安全 Cookie 中</p></li>
          <li><span>✓</span><p>充值到账以支付平台回调结果为准</p></li>
        </ul>
      </section>

      <section class="auth-panel" aria-labelledby="form-title">
        <div class="auth-panel-header">
          <h2 id="form-title">登录</h2>
          <p>使用你的 Niko 用户名或已绑定邮箱。</p>
        </div>
        <form data-auth-form novalidate>
          <label class="field">
            <span class="field-label">账号或邮箱</span>
            <input
              name="account"
              type="text"
              autocomplete="username"
              inputmode="email"
              maxlength="254"
              required
              placeholder="输入用户名或邮箱"
            />
          </label>
          <label class="field">
            <span class="field-label">密码</span>
            <span class="input-wrap">
              <input
                class="password-input"
                name="password"
                type="password"
                autocomplete="current-password"
                minlength="8"
                maxlength="128"
                required
                placeholder="输入密码"
              />
              <button class="password-toggle" type="button" data-password-toggle>显示</button>
            </span>
          </label>
          <div class="turnstile-field" data-turnstile-container>
            <div class="turnstile-loading">正在准备安全验证…</div>
          </div>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          <button class="form-submit" type="submit" data-submit>登录</button>
        </form>
        <p class="auth-switch">还没有账号？<a href="/register/">注册 Niko</a></p>
      </section>
    </main>
  </body>
</html>
