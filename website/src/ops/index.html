<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>使用情况 — Niko</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles-wordmark.css" />
    <link rel="stylesheet" href="/account.css" />
    <script type="module" src="/js/ops.js"></script>
  </head>
  <body class="account-body ops-body">
    <a class="skip-link" href="#main">跳到使用情况</a>
    <header class="account-header">
      <a class="brand" href="/" aria-label="Niko 首页">
        <img src="/assets/niko-lockup-horizontal.svg" alt="Niko" width="168" height="60" />
      </a>
      <a class="text-link" href="/">返回首页</a>
    </header>

    <main class="ops-main" id="main">
      <p class="page-notice" data-ops-notice role="status" aria-live="polite"></p>

      <section class="ops-gate" data-ops-gate>
        <p class="account-eyebrow">内部看板</p>
        <h1>使用情况</h1>
        <p class="ops-lead">看安装包下载次数，以及最近三分钟打开过 Niko 的设备。不含账号或个人身份。</p>
        <form class="ops-form" data-ops-form>
          <label class="field">
            <span class="field-label">访问口令</span>
            <input
              type="password"
              name="secret"
              autocomplete="current-password"
              required
              minlength="16"
              placeholder="请输入访问口令"
            />
          </label>
          <button class="form-submit" type="submit" data-ops-submit>查看</button>
        </form>
      </section>

      <div class="ops-board" data-ops-content hidden>
        <header class="ops-board-head">
          <div>
            <p class="account-eyebrow">内部看板</p>
            <h1>使用情况</h1>
          </div>
          <div class="ops-board-meta">
            <span data-window></span>
            <span data-generated-at></span>
            <button class="command-button" type="button" data-ops-refresh>重新读取</button>
          </div>
        </header>

        <section class="ops-metrics" aria-label="使用情况摘要">
          <article>
            <span>正在使用</span>
            <strong data-online-total>—</strong>
            <p data-online-breakdown></p>
          </article>
          <article>
            <span>安装包下载</span>
            <strong data-download-total>—</strong>
            <p data-download-breakdown></p>
          </article>
        </section>

        <section class="ops-split">
          <div>
            <h2>当前版本</h2>
            <ul class="ops-list" data-online-versions></ul>
          </div>
          <div>
            <h2>各版本安装包</h2>
            <div class="ops-releases" data-download-releases></div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
