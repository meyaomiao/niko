<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f5f7fa" />
    <title>确认充值结果 — Niko</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles-wordmark.css" />
    <link rel="stylesheet" href="/account.css" />
    <script type="module" src="/js/payment-return.js"></script>
  </head>
  <body class="account-body">
    <a class="skip-link" href="#main">跳到充值结果</a>
    <header class="account-header">
      <a class="brand" href="/" aria-label="Niko 首页">
        <img src="/assets/niko-lockup-horizontal.svg" alt="Niko" width="168" height="60" />
      </a>
      <a class="text-link" href="/account/">个人中心</a>
    </header>
    <main class="payment-return" id="main">
      <section class="payment-result" data-payment-result data-state="pending" aria-live="polite">
        <div class="result-mark" data-result-mark><div class="spinner" aria-hidden="true"></div></div>
        <p class="account-eyebrow">充值结果</p>
        <h1 data-result-title>正在确认支付结果</h1>
        <p data-result-message>页面返回不代表已经到账，Niko 正在向账户服务查询最终订单状态。</p>
        <div class="hero-actions">
          <a class="button button-primary" href="/account/" data-result-action>返回个人中心</a>
          <button class="button button-secondary" type="button" data-retry hidden>重新查询</button>
        </div>
      </section>
    </main>
  </body>
</html>
