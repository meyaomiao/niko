name: Niko CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "brand/**"
      - "website/**"
      - ".github/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "brand/**"
      - "website/**"
      - ".github/**"

concurrency:
  group: niko-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked --all-targets
      # Only explicit temporary-root fixtures; never exercise installed applications.
      - run: cargo test --locked --lib isolated_ -- --test-threads=1

  ts-check:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
