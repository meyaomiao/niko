name: Repair Release Metadata

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag (e.g. niko-v0.1.2)"
        required: true
      target_sha:
        description: "Commit used to build the release artifacts"
        required: true
      confirm:
        description: "Type REPAIR to confirm"
        required: true

permissions:
  contents: write

jobs:
  repair:
    name: Repair updater metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Validate repair request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_CONFIRM" != "REPAIR" ]; then
            echo "::error::Confirmation must be exactly REPAIR"
            exit 1
          fi

          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)")
          if [ "$RELEASE_TAG" != "niko-v${VERSION}" ]; then
            echo "::error::Tag must be niko-v${VERSION} for app version ${VERSION}"
            exit 1
          fi

          CHECKED_OUT_SHA=$(git rev-parse HEAD)
          EXPECTED_SHA=$(git rev-parse "${TARGET_SHA}^{commit}")
          if [ "$CHECKED_OUT_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Checked out $CHECKED_OUT_SHA instead of $EXPECTED_SHA"
            exit 1
          fi

          RELEASE_JSON=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,isDraft,targetCommitish)
          if [ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" != "true" ]; then
            echo "::error::Release ${RELEASE_TAG} is not a draft"
            exit 1
          fi

          echo "release_id=$(jq -r '.databaseId' <<< "$RELEASE_JSON")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "target_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Install signing tools
        run: |
          npm ci
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Download existing draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir repair-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir repair-assets \
            --pattern "Niko.app.tar.gz" \
            --pattern "Niko.app.tar.gz.sig" \
            --pattern "Niko_*_universal.dmg" \
            --pattern "Niko_*_x64_en-US.msi" \
            --pattern "Niko_*_x64-setup.exe" \
            --pattern "SHA256SUMS.txt" \
            --pattern "SHA256SUMS_win.txt"
          find repair-assets -maxdepth 1 -type f -print | sort

      - name: Sign MSI and verify release assets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          msi_files=(repair-assets/*.msi)
          macos_files=(repair-assets/*.app.tar.gz)
          if [ "${#msi_files[@]}" -ne 1 ] || [ "${#macos_files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one MSI and one macOS updater archive"
            exit 1
          fi

          msi_file="${msi_files[0]}"
          macos_file="${macos_files[0]}"
          npx tauri signer sign "$msi_file"

          node -e "const c=require('./src-tauri/tauri.conf.json'); process.stdout.write(Buffer.from(c.plugins.updater.pubkey, 'base64'))" > updater.pub
          base64 --decode "${macos_file}.sig" > macos.minisig
          base64 --decode "${msi_file}.sig" > windows.minisig
          minisign -Vm "$macos_file" -x macos.minisig -p updater.pub
          minisign -Vm "$msi_file" -x windows.minisig -p updater.pub

          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const directory = "repair-assets";
          const files = fs.readdirSync(directory);
          const checksumFiles = ["SHA256SUMS.txt", "SHA256SUMS_win.txt"];
          let checked = 0;

          for (const checksumFile of checksumFiles) {
            const lines = fs.readFileSync(path.join(directory, checksumFile), "utf8").split(/\r?\n/);
            for (const line of lines) {
              if (!line.trim()) continue;
              const match = line.match(/^([a-fA-F0-9]{64})\s+(.+)$/);
              if (!match) throw new Error(`Invalid checksum line: ${line}`);
              const filename = path.basename(match[2]);
              if (!files.includes(filename)) throw new Error(`Missing checksummed asset: ${filename}`);
              const digest = crypto
                .createHash("sha256")
                .update(fs.readFileSync(path.join(directory, filename)))
                .digest("hex");
              if (digest !== match[1].toLowerCase()) throw new Error(`SHA256 mismatch: ${filename}`);
              checked += 1;
            }
          }

          if (checked !== 4) throw new Error(`Expected four checksummed assets, verified ${checked}`);
          console.log(`Verified SHA256 for ${checked} release assets`);
          NODE

      - name: Generate corrected latest.json
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const directory = "repair-assets";
          const files = fs.readdirSync(directory);
          function exactlyOne(suffix) {
            const matches = files.filter((file) => file.endsWith(suffix));
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one *${suffix}, found ${matches.length}`);
            }
            return matches[0];
          }

          const macosFilename = exactlyOne(".app.tar.gz");
          const windowsFilename = exactlyOne(".msi");
          const macosSignature = fs.readFileSync(path.join(directory, `${macosFilename}.sig`), "utf8").trim();
          const windowsSignature = fs.readFileSync(path.join(directory, `${windowsFilename}.sig`), "utf8").trim();
          if (!macosSignature || !windowsSignature) throw new Error("Updater signature is empty");

          const tag = process.env.RELEASE_TAG;
          const baseUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`;
          const latest = {
            version: process.env.APP_VERSION,
            notes: `查看 Release Notes：https://github.com/${process.env.GITHUB_REPOSITORY}/releases/tag/${tag}`,
            pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
            platforms: {
              "darwin-universal": {
                signature: macosSignature,
                url: `${baseUrl}/${macosFilename}`,
              },
              "windows-x86_64": {
                signature: windowsSignature,
                url: `${baseUrl}/${windowsFilename}`,
              },
            },
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(latest, null, 2)}\n`);
          console.log(fs.readFileSync("latest.json", "utf8"));
          NODE

      - name: Update draft assets and target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          signatures=(repair-assets/*.msi.sig)
          if [ "${#signatures[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one MSI signature"
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${signatures[0]}" latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -f target_commitish="$TARGET_SHA" \
            --silent

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,targetCommitish,assets
