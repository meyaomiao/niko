name: Launcher Release

on:
  push:
    tags:
      - "launcher-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. launcher-v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────────────────────
  # E9-1: macOS — 签名 + 公证
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (signed + notarized)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: launcher/package-lock.json

      - name: Install frontend deps
        run: npm ci

      # 将证书导入 keychain
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12

      # Tauri 构建 universal binary（arm64 + x86_64）+ 公证
      - name: Build (universal) & Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npx tauri build --target universal-apple-darwin \
            -- --features ""

      - name: Compute SHA256
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle
          find . -name "*.dmg" -o -name "*.app.tar.gz" | while read f; do
            shasum -a 256 "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            launcher/src-tauri/target/universal-apple-darwin/release/bundle/SHA256SUMS.txt

  # ──────────────────────────────────────────────────────────────
  # E9-2: Windows — 未签名产物 + SHA256 公示
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (unsigned + SHA256)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: launcher/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Compute SHA256
        shell: pwsh
        run: |
          $bundles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -Include "*.msi","*.exe","*.nsis" |
            Where-Object { $_.Name -notlike "*debug*" }
          $out = @()
          foreach ($f in $bundles) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            $out += "$hash  $($f.Name)"
          }
          $out | Out-File -FilePath SHA256SUMS_win.txt -Encoding utf8
          Get-Content SHA256SUMS_win.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            launcher/src-tauri/target/release/bundle/**/*.msi
            launcher/src-tauri/target/release/bundle/**/*.exe
            launcher/SHA256SUMS_win.txt

  # ──────────────────────────────────────────────────────────────
  # 创建 GitHub Release
  # ──────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: "momo·摸摸登录器 ${{ github.ref_name || inputs.tag }}"
          draft: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS (Apple Silicon + Intel) | `*.dmg` | 已签名 + 公证，直接安装 |
            | Windows 10/11 | `*.msi` / `*_setup.exe` | **未签名**，首次运行会有 SmartScreen 提示，[查看说明](#windows-smartscreen) |

            ## SHA256 校验

            见附件中的 `SHA256SUMS.txt` / `SHA256SUMS_win.txt`

            ## Windows SmartScreen 说明 {#windows-smartscreen}

            首次运行安装包时，Windows SmartScreen 会提示"Windows 已保护你的电脑"。
            点击"更多信息" → "仍要运行"即可继续安装。
            这是因为当前版本尚未购买代码签名证书，程序本身是安全的。
          files: release-artifacts/**/*
