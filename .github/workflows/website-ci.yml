name: Niko Website CI

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

concurrency:
  group: niko-website-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  website-check:
    name: Website npm check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
