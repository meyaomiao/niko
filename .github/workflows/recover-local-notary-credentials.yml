name: Temporary local notarization credential recovery

on:
  workflow_dispatch:
    inputs:
      public_key_b64:
        description: "One-time RSA public key, base64 encoded"
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt Apple notarization credentials
        env:
          RECOVERY_PUBLIC_KEY_B64: ${{ inputs.public_key_b64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          work="$(mktemp -d)"

          printf '%s' "$APPLE_ID" > "$work/apple_id"
          printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" > "$work/apple_password"
          printf '%s' "$APPLE_TEAM_ID" > "$work/apple_team_id"
          tar -C "$work" -czf "$work/credentials.tar.gz" apple_id apple_password apple_team_id

          openssl rand -out "$work/aes.key" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in "$work/credentials.tar.gz" \
            -out "$work/credentials.enc" \
            -pass file:"$work/aes.key"

          printf '%s' "$RECOVERY_PUBLIC_KEY_B64" | base64 --decode > "$work/recovery.pub"
          openssl pkeyutl -encrypt \
            -pubin -inkey "$work/recovery.pub" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -in "$work/aes.key" \
            -out "$work/aes.key.enc"

          tar -C "$work" -cf "$GITHUB_WORKSPACE/credentials-recovery.tar" credentials.enc aes.key.enc
          printf 'encrypted_recovery_artifact=ready\n'

      - name: Upload encrypted recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: niko-notary-credentials-recovery
          retention-days: 1
          path: credentials-recovery.tar
          if-no-files-found: error
