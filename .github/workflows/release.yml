name: Niko Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. niko-v0.1.1)"
        required: true
      confirm:
        description: "Type RELEASE to confirm"
        required: true

concurrency:
  group: niko-release-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-release:
    name: Validate release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate branch, confirmation, and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Releases must be dispatched from main"
            exit 1
          fi

          if [ "$RELEASE_CONFIRM" != "RELEASE" ]; then
            echo "::error::Confirmation must be exactly RELEASE"
            exit 1
          fi

          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)")
          EXPECTED_TAG="niko-v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag must be $EXPECTED_TAG for app version $VERSION"
            exit 1
          fi

          echo "Validated release $RELEASE_TAG from main"

  # ──────────────────────────────────────────────────────────────
  # E9-1: macOS — 签名 + 公证
  # ──────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (signed + notarized)
    needs: validate-release
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      app_version: ${{ steps.version.outputs.version }}
      macos_sig: ${{ steps.sig.outputs.signature }}
      macos_url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security list-keychains -d user -s build.keychain
          security import /tmp/certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -1 | sed -n 's/.*"\(.*\)".*/\1/p')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in build.keychain"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build (universal) & Notarize
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          npx tauri build --target universal-apple-darwin

      - name: Compute SHA256 & extract updater sig
        id: sig
        run: |
          cd src-tauri/target/universal-apple-darwin/release/bundle
          find . -name "*.dmg" -o -name "*.app.tar.gz" | while read f; do
            shasum -a 256 "$f"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # 提取 .app.tar.gz.sig（tauri updater 签名）
          SIG=$(cat macos/*.app.tar.gz.sig 2>/dev/null || echo "")
          echo "signature=$SIG" >> "$GITHUB_OUTPUT"

      - name: Set macOS download URL
        id: url
        run: |
          TAG=${{ inputs.tag }}
          VER=${{ steps.version.outputs.version }}
          echo "url=https://github.com/meyaomiao/niko/releases/download/${TAG}/Niko_${VER}_universal.app.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/universal-apple-darwin/release/bundle/SHA256SUMS.txt

  # ──────────────────────────────────────────────────────────────
  # E9-2: Windows — 未签名产物 + SHA256 公示
  # ──────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (unsigned + SHA256)
    needs: validate-release
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      win_sig: ${{ steps.sig.outputs.signature }}
      win_url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Compute SHA256 & extract updater sig
        id: sig
        shell: pwsh
        run: |
          $bundles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -Include "*.msi","*.exe","*.nsis" |
            Where-Object { $_.Name -notlike "*debug*" }
          $out = @()
          foreach ($f in $bundles) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            $out += "$hash  $($f.Name)"
          }
          $out | Out-File -FilePath SHA256SUMS_win.txt -Encoding utf8
          Get-Content SHA256SUMS_win.txt
          $sigFile = Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.msi.zip.sig" | Select-Object -First 1
          $sig = if ($sigFile) { Get-Content $sigFile.FullName -Raw } else { "" }
          echo "signature=$($sig.Trim())" >> $env:GITHUB_OUTPUT

      - name: Set Windows download URL
        id: url
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          $ver = node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)"
          echo "url=https://github.com/meyaomiao/niko/releases/download/$tag/Niko_${ver}_x64_en-US.msi.zip" >> $env:GITHUB_OUTPUT

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.msi.zip
            src-tauri/target/release/bundle/**/*.msi.zip.sig
            src-tauri/target/release/bundle/**/*.exe
            SHA256SUMS_win.txt

  # ──────────────────────────────────────────────────────────────
  # E9-4: 生成 latest.json（Tauri updater 所需）
  # ──────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f | sort

      - name: Generate latest.json
        run: |
          TAG=${{ inputs.tag }}
          VER=${{ needs.build-macos.outputs.app_version }}
          MACOS_SIG='${{ needs.build-macos.outputs.macos_sig }}'
          MACOS_URL='${{ needs.build-macos.outputs.macos_url }}'
          WIN_SIG='${{ needs.build-windows.outputs.win_sig }}'
          WIN_URL='${{ needs.build-windows.outputs.win_url }}'
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > latest.json << JSON
          {
            "version": "$VER",
            "notes": "查看 Release Notes：https://github.com/meyaomiao/niko/releases/tag/$TAG",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "darwin-universal": {
                "signature": "$MACOS_SIG",
                "url": "$MACOS_URL"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              }
            }
          }
          JSON
          cat latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: "Niko ${{ inputs.tag }}"
          draft: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            |---|---|---|
            | macOS (Apple Silicon + Intel) | `*.dmg` | 已签名 + 公证，直接安装 |
            | Windows 10/11 | `*.msi` / `*_setup.exe` | **未签名**，首次运行会有 SmartScreen 提示，[查看说明](#windows-smartscreen) |

            ## SHA256 校验

            见附件中的 `SHA256SUMS.txt` / `SHA256SUMS_win.txt`

            ## Windows SmartScreen 说明 {#windows-smartscreen}

            首次运行安装包时，Windows SmartScreen 会提示"Windows 已保护你的电脑"。
            点击 **更多信息** → **仍要运行** 即可继续安装。
            这是因为当前版本尚未购买代码签名证书，程序本身是安全的。
            SHA256 校验和已公示，可自行核验。
          files: |
            release-artifacts/**/*
            latest.json
