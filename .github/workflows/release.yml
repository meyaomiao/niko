name: Niko Windows Release Artifacts

# macOS release artifacts are intentionally excluded from GitHub Actions.
# Build, sign, notarize, and staple macOS releases on the owner's local Mac:
# docs/release-process.md

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. niko-v0.1.3)"
        required: true
      confirm:
        description: "Type WINDOWS to confirm this Windows-only build"
        required: true

concurrency:
  group: niko-windows-release-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Windows build request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate branch, confirmation, and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::Release artifacts must be built from main"
            exit 1
          fi

          if [ "$RELEASE_CONFIRM" != "WINDOWS" ]; then
            echo "::error::Confirmation must be exactly WINDOWS"
            exit 1
          fi

          VERSION=$(node -e "const c=require('./src-tauri/tauri.conf.json'); console.log(c.version)")
          EXPECTED_TAG="niko-v${VERSION}"
          if [ "$RELEASE_TAG" != "$EXPECTED_TAG" ]; then
            echo "::error::Tag must be $EXPECTED_TAG for app version $VERSION"
            exit 1
          fi

          echo "Validated Windows artifacts for $RELEASE_TAG from main"

  build-windows:
    name: Windows (unsigned + SHA256)
    needs: validate-release
    # Use an isolated GitHub-hosted machine; local Smart App Control blocks Cargo.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: Run frontend regression tests
        run: npm test

      - name: Build Windows installer (NSIS EXE)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Verify installer installation and application startup
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $expectedVersion = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          $installers = @(Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "niko-install-smoke"
          $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $clientPath = Join-Path $installDir "niko.exe"
          $client = Get-Item -LiteralPath $clientPath -ErrorAction Stop
          if ($client.VersionInfo.ProductVersion -notin @($expectedVersion, "$expectedVersion.0")) {
            throw "Installed version does not match the release"
          }
          $smoke = Start-Process -FilePath $clientPath -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $smoke.Refresh()
              if ($smoke.HasExited) { throw "Installed application exited before showing its window" }
            } while ($smoke.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)
            if ($smoke.MainWindowHandle -eq 0) { throw "Installed application window was not created" }
            "Installer and application startup verified for $expectedVersion"
          } finally {
            $smoke.Refresh()
            if (-not $smoke.HasExited) {
              $null = $smoke.CloseMainWindow()
              if (-not $smoke.WaitForExit(5000)) { Stop-Process -Id $smoke.Id -Force }
            }
          }

      - name: Compute SHA256 and validate updater signatures
        shell: powershell
        run: |
          $bundles = Get-ChildItem `
            -Path "src-tauri/target/release/bundle" `
            -Recurse `
            -Include "*.exe" |
          Where-Object { $_.Name -notlike "*debug*" }
          $out = @()
          foreach ($f in $bundles) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
            $out += "$hash  $($f.Name)"
          }
          $out | Out-File -FilePath SHA256SUMS_win.txt -Encoding utf8
          Get-Content SHA256SUMS_win.txt

          $exeFiles = @(Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -Filter "*.exe" -File)
          if ($exeFiles.Count -ne 1) {
            throw "Expected exactly one EXE installer"
          }

          $exeSig = Get-Item "$($exeFiles[0].FullName).sig" -ErrorAction Stop
          if ($exeSig.Length -eq 0) {
            throw "Windows updater signature is missing or empty"
          }

      - name: Upload Windows artifacts for local release assembly
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.exe.sig
            SHA256SUMS_win.txt
          if-no-files-found: error

      - name: Record the local macOS next step
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          @"
          ## Windows artifacts ready

          Download the **windows-unsigned** artifact to the owner's Mac.
          Build, sign, notarize, and staple macOS locally, then assemble the draft GitHub Release locally.

          Release tag: ``$env:RELEASE_TAG``
          Procedure: ``docs/release-process.md``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
